<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>共聴系統図エディタ</title>
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<header id="toolbar">
  <button id="menuBtn" class="m-only" aria-label="メニュー" aria-expanded="false">☰</button>
  <div class="brand">共聴系統図</div>
  <input id="docTitle" class="title-input" placeholder="図面名">
  <div class="tb-group collapsible">
    <button data-act="new" title="新規">新規</button>
    <button data-act="open" title="JSONファイルを開く">開く</button>
    <button data-act="save" title="JSONで保存">保存</button>
    <button data-act="sample" title="サンプル: ビル共同受信 5階新設(JEITA 3-7)">例:ビル</button>
    <button data-act="sample2" title="サンプル: ホーム共同受信 C/N計算例(JEITA 3-8)">例:戸建</button>
  </div>
  <div class="tb-group">
    <button data-act="undo" title="元に戻す (Ctrl+Z)">↶</button>
    <button data-act="redo" title="やり直し (Ctrl+Y)">↷</button>
  </div>
  <div class="tb-group">
    <button data-act="fit" title="全体表示">全体</button>
    <button data-act="zoomin" title="拡大">＋</button>
    <button data-act="zoomout" title="縮小">－</button>
  </div>
  <div class="tb-group collapsible">
    <label class="chk"><input type="checkbox" id="showNum" checked>番号</label>
    <label class="chk"><input type="checkbox" id="showCable" checked>ケーブル</label>
    <label class="chk"><input type="checkbox" id="showLvl" checked>端子レベル</label>
    <label class="chk"><input type="checkbox" id="showCN">C/N</label>
  </div>
  <div class="tb-group right collapsible">
    <button data-act="svg">SVG出力</button>
    <button data-act="png">PNG出力</button>
    <button data-act="print">印刷</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main id="layout">
  <aside id="palette" aria-label="部品"></aside>

  <section id="center">
    <div id="canvasWrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <g id="viewport"><g id="world"></g><g id="overlay"></g></g>
      </svg>
      <div id="hint"></div>
    </div>
    <div id="bottom">
      <nav class="tabs">
        <button data-tab="calc" class="on">レベル計算表</button>
        <button data-tab="list">端子一覧</button>
        <button data-tab="legend">図記号・損失データ</button>
      </nav>
      <div id="tab-calc" class="tabpane on"></div>
      <div id="tab-list" class="tabpane"></div>
      <div id="tab-legend" class="tabpane"></div>
    </div>
  </section>

  <aside id="side">
    <div id="props"></div>
    <div id="warnings"></div>
  </aside>
</main>

<nav id="mnav" class="m-only" aria-label="パネル切替">
  <button data-sheet="palette"><span class="ico">＋</span>部品</button>
  <button data-sheet="props"><span class="ico">⚙</span>詳細</button>
  <button data-sheet="calc"><span class="ico">▦</span>計算表</button>
  <button data-sheet="check"><span class="ico">!</span>チェック<b id="mBadge"></b></button>
</nav>

<div id="print"></div>

<script src="js/lib.js?v=12"></script>
<script src="js/sample.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
